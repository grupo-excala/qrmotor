<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motores · Grupo Excala</title>
<script>
  // ============================================================
  // ÚNICA LÍNEA QUE SE EDITA si cambia la dirección de la app:
  // pega aquí la "URL de la app web" (Apps Script > Implementar).
  // Edítala igual en index.html y en 404.html.
  // ============================================================
  var APP = 'https://script.google.com/a/macros/grupoexcala.com/s/AKfycbyKnFGqMPYoPmVNVhtetl8KW0orwHaAmKup7F8s2xPxV9ycCEWxKqlXMKyDVA-A0JOccQ/exec';

  (function () {
    // El QR trae el código del motor en la ruta: https://usuario.github.io/MOT-0001
    // (también acepta ?m=MOT-0001 o #MOT-0001)
    var texto = decodeURIComponent(location.pathname + ' ' + location.search + ' ' + location.hash).toUpperCase();
    var m = texto.match(/([A-Z]{2,6}-\d{3,})/);
    if (APP.indexOf('PEGAR_AQUI') === 0) {
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('msg').textContent = 'Falta pegar la dirección de la app en index.html y 404.html.';
      });
      return;
    }
    location.replace(APP + (m ? (APP.indexOf('?') >= 0 ? '&' : '?') + 'm=' + m[1] : ''));
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: Arial, sans-serif; background: #F2F4F3; color: #3F4F4D; text-align: center; }
  b { color: #5E7471; font-size: 18px; }
  .l { width: 40px; height: 3px; background: #A9B700; margin: 10px auto; }
</style>
</head>
<body>
  <div>
    <b>Gestión de Motores</b>
    <div class="l"></div>
    <div>Grupo Excala · Taller Eléctrico</div>
    <p id="msg">Abriendo la ficha del motor…</p>
    <noscript>Activa JavaScript para abrir la ficha.</noscript>
  </div>
</body>
</html>
